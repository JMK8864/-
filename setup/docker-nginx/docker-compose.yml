# FTMS reverse proxy (nginx)    실행: docker compose up -d
services:
  ftms-nginx:
    image: nginx:stable-alpine          # 운영에서는 버전 고정 권장 (예: nginx:1.28-alpine)
    container_name: ftms-nginx
    restart: unless-stopped
    ports:
      - "${FTMS_HTTP_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 에서 호스트 PC 접근용 (Docker Desktop 은 기본 제공)
    environment:
      TZ: Asia/Seoul
      FTMS_API_UPSTREAM: ${FTMS_API_UPSTREAM:-host.docker.internal:8121}
      FTMS_WEB_UPSTREAM: ${FTMS_WEB_UPSTREAM:-host.docker.internal:8122}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro                       # [선택구성] ./nginx/alt 로 교체
      - ./nginx/ftms_proxy_headers:/etc/nginx/ftms_proxy_headers:ro
      - ./logs:/var/log/nginx
      # - ./wwwroot:/usr/share/nginx/ftms:ro                            # [선택구성] 정적 파일 직접 제공 시
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
