# FTMS 로컬 실행 환경: TimescaleDB + nginx 리버스 프록시
#   docker compose up -d            (전체)
#   docker compose up -d ftms-db    (DB 만)
name: ftms-dev

services:
  ftms-db:
    image: timescale/timescaledb:latest-pg17     # PostgreSQL 17 + TimescaleDB (운영은 버전 고정 권장)
    container_name: ftms-db
    restart: unless-stopped
    ports:
      - "${FTMS_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FTMS_DB_PASSWORD: ${FTMS_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ftms-db-data:/var/lib/postgresql/data
      - ./db/init/10-ftms-init.sh:/docker-entrypoint-initdb.d/10-ftms-init.sh:ro   # 이미지 기본 init 스크립트는 그대로 두고 추가
      - ./db/sql:/ftms-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  ftms-nginx:
    image: nginx:stable-alpine
    container_name: ftms-nginx
    restart: unless-stopped
    ports:
      - "${FTMS_HTTP_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Seoul
      FTMS_API_UPSTREAM: ${FTMS_API_UPSTREAM:-host.docker.internal:8121}
      FTMS_WEB_UPSTREAM: ${FTMS_WEB_UPSTREAM:-host.docker.internal:8122}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ftms_proxy_headers:/etc/nginx/ftms_proxy_headers:ro
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ftms-db-data:
