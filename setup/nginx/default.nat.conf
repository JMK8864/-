# =============================================================================
# FTMS reverse proxy - nginx (WSL Docker 컨테이너)       [가이드 12단계]
#
#   대상 환경 : WSL2 "NAT" 네트워크 모드  (wslinfo --networking-mode → nat)
#               컨테이너를 -p 80:80 --add-host winhost:<WINIP> 로 실행 (WINIP = WSL 기본 게이트웨이)
#   WSL 위치  : ~/ftms-nginx/default.conf  (이 파일을 그 이름으로 복사)
#   컨테이너  : -v ~/ftms-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
#               (이미지 기본 default.conf 를 덮어씀 → 포트 충돌 없음)
#
#   라우팅 (reverse-proxy.ftms(YARP) appsettings.json 과 동일)
#     /chathub, /api/, /health  →  app-server.ftms   winhost:8121
#     그 외 전부                →  DxfBlazorViewer   winhost:8122
#
#   포트 변경 : listen 80 → 다른 값.  변경 후 반드시
#               docker exec ftms-nginx nginx -t && docker restart ftms-nginx
#               (nginx 는 시작할 때만 설정을 읽음)
#
#   주의 : location 안에서 proxy_set_header 를 하나라도 쓰면 server 레벨 값이
#          상속되지 않으므로 공통 헤더를 각 location 에 모두 적음
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ftms_api { server winhost:8121; keepalive 32; }
upstream ftms_web { server winhost:8122; keepalive 32; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 500m;          # YARP 설정(MaxRequestBodySize 500MB)과 동일
    proxy_http_version 1.1;

    # SignalR (WebSocket 업그레이드 필수)
    location /chathub {
        proxy_pass http://ftms_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }

    # REST API
    location /api/ {
        proxy_pass http://ftms_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;            # RawData 다운로드 등 긴 요청
    }

    # Health check
    location = /health {
        proxy_pass http://ftms_api;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    # 나머지 → Blazor WASM (DxfBlazorViewer)
    location / {
        proxy_pass http://ftms_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
